<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дуэль - Brain Trainer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f172a; color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .duel-container { max-width: 900px; width: 100%; padding: 20px; }
        .duel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { color: #94a3b8; text-decoration: none; font-size: 16px; }
        .back-btn:hover { color: #fff; }
        h1 { font-size: 28px; display: flex; align-items: center; gap: 10px; }

        /* VS Intro Screen - диагональный градиент */
        .vs-intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ef4444 0%, #ef4444 45%, #1e293b 45%, #1e293b 55%, #3b82f6 55%, #3b82f6 100%);
            z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            animation: fadeOut 0.5s ease 3.5s forwards;
        }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        .vs-intro-content { display: flex; align-items: center; justify-content: center; gap: 80px; }
        .vs-player-intro { text-align: center; }

        /* Анимированный человечек */
        .human-intro { width: 160px; height: 210px; position: relative; margin: 0 auto; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.4)); }
        .human-intro .head { width: 70px; height: 75px; background: currentColor; border-radius: 50% 50% 40% 40%; margin: 0 auto; position: relative; box-shadow: inset -5px -5px 12px rgba(0,0,0,0.2), inset 5px 5px 15px rgba(255,255,255,0.3); animation: headBob 2s ease-in-out infinite; }
        .human-intro .head::before, .human-intro .head::after { content: ''; position: absolute; width: 12px; height: 12px; background: #1a1a2e; border-radius: 50%; top: 25px; box-shadow: inset 0 3px 5px rgba(0,0,0,0.5); }
        .human-intro .head::before { left: 14px; } .human-intro .head::after { right: 14px; }
        .human-intro .head .mouth { position: absolute; width: 20px; height: 10px; border-bottom: 3px solid #1a1a2e; border-radius: 0 0 10px 10px; bottom: 18px; left: 50%; transform: translateX(-50%); }
        .human-intro .body { width: 75px; height: 90px; background: currentColor; margin: -5px auto 0; border-radius: 20px 20px 12px 12px; position: relative; box-shadow: inset -5px -5px 12px rgba(0,0,0,0.2), inset 5px 5px 15px rgba(255,255,255,0.2); animation: bodySway 2s ease-in-out infinite; }
        .human-intro .arms { position: absolute; width: 100%; height: 50px; top: 20px; }
        .human-intro .arm { position: absolute; width: 22px; height: 55px; background: currentColor; border-radius: 12px; box-shadow: inset -3px -3px 8px rgba(0,0,0,0.2); }
        .human-intro .arm.left { left: -26px; animation: leftArmSwing 1.5s ease-in-out infinite; transform-origin: top right; }
        .human-intro .arm.right { right: -26px; animation: rightArmSwing 1.5s ease-in-out infinite; transform-origin: top left; }
        .human-intro .legs { display: flex; justify-content: center; gap: 20px; margin-top: 5px; }
        .human-intro .leg { width: 26px; height: 50px; background: currentColor; border-radius: 10px; box-shadow: inset -4px -4px 10px rgba(0,0,0,0.2); }
        .human-intro .leg:first-child { animation: leftLegBob 2s ease-in-out infinite; }
        .human-intro .leg:last-child { animation: rightLegBob 2s ease-in-out infinite; }

        @keyframes headBob { 0%,100%{transform:rotate(0)} 30%{transform:rotate(2deg)} 60%{transform:rotate(-2deg)} }
        @keyframes bodySway { 0%,100%{transform:translateX(0)} 50%{transform:translateX(3px)} }
        @keyframes leftArmSwing { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-12deg)} }
        @keyframes rightArmSwing { 0%,100%{transform:rotate(0)} 50%{transform:rotate(12deg)} }
        @keyframes leftLegBob { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-6deg)} }
        @keyframes rightLegBob { 0%,100%{transform:rotate(0)} 50%{transform:rotate(6deg)} }

        .intro-name { font-size: 32px; font-weight: bold; margin: 20px 0 5px; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .intro-elo { font-size: 24px; color: #fbbf24; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .vs-text-intro { font-size: 120px; font-weight: 900; color: #fff; text-shadow: 0 0 50px rgba(0,0,0,0.5); animation: vsPulse 0.8s ease infinite; }
        @keyframes vsPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        .countdown-timer { margin-top: 50px; font-size: 80px; font-weight: bold; color: #fff; text-shadow: 0 0 40px rgba(255,255,255,0.5); }

        /* Game Screen */
        .vs-screen { display: flex; align-items: center; justify-content: space-around; margin: 30px 0; }
        .player-card { text-align: center; flex: 1; }
        .human-small { width: 110px; height: 145px; margin: 0 auto; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.3)); }
        .human-small .head { width: 48px; height: 52px; background: currentColor; border-radius: 50% 50% 40% 40%; margin: 0 auto; position: relative; box-shadow: inset -3px -3px 8px rgba(0,0,0,0.2), inset 3px 3px 10px rgba(255,255,255,0.2); animation: headBob 2s ease-in-out infinite; }
        .human-small .head::before, .human-small .head::after { content: ''; position: absolute; width: 8px; height: 8px; background: #1a1a2e; border-radius: 50%; top: 17px; }
        .human-small .head::before { left: 9px; } .human-small .head::after { right: 9px; }
        .human-small .head .mouth { position: absolute; width: 14px; height: 7px; border-bottom: 2px solid #1a1a2e; border-radius: 0 0 8px 8px; bottom: 12px; left: 50%; transform: translateX(-50%); }
        .human-small .body { width: 52px; height: 62px; background: currentColor; margin: -3px auto 0; border-radius: 15px 15px 8px 8px; position: relative; box-shadow: inset -3px -3px 8px rgba(0,0,0,0.2); animation: bodySway 2s ease-in-out infinite; }
        .human-small .arms { position: absolute; width: 100%; height: 35px; top: 14px; }
        .human-small .arm { position: absolute; width: 15px; height: 38px; background: currentColor; border-radius: 8px; }
        .human-small .arm.left { left: -18px; animation: leftArmSwing 1.5s ease-in-out infinite; }
        .human-small .arm.right { right: -18px; animation: rightArmSwing 1.5s ease-in-out infinite; }
        .human-small .legs { display: flex; justify-content: center; gap: 14px; margin-top: 3px; }
        .human-small .leg { width: 18px; height: 34px; background: currentColor; border-radius: 7px; }
        .human-small .leg:first-child { animation: leftLegBob 2s ease-in-out infinite; }
        .human-small .leg:last-child { animation: rightLegBob 2s ease-in-out infinite; }

        .player-name { font-size: 18px; font-weight: 500; margin: 12px 0 5px; }
        .player-elo { color: #fbbf24; font-size: 16px; margin-bottom: 10px; }
        .player-score { font-size: 42px; font-weight: bold; }
        .vs-badge { font-size: 40px; font-weight: bold; color: #ef4444; padding: 0 20px; }
        .round-info { text-align: center; margin: 20px 0; background: #1e293b; padding: 8px 20px; border-radius: 20px; display: inline-block; margin-left: auto; margin-right: auto; width: fit-content; }
        .task-container { text-align: center; margin: 30px 0; }
        #task { font-size: 42px; margin-bottom: 20px; min-height: 70px; font-weight: 500; transition: color 0.2s, text-shadow 0.2s; }
        .answer-box { display: flex; gap: 10px; max-width: 400px; margin: 0 auto; }
        #answer { flex: 1; padding: 15px; background: #1e293b; border: 2px solid #334155; border-radius: 10px; color: #fff; font-size: 18px; outline: none; transition: all 0.2s; }
        #answer:focus { border-color: #38bdf8; }
        button { padding: 15px 25px; background: #38bdf8; border: none; border-radius: 10px; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0ea5e9; }
        .result-screen { text-align: center; padding: 40px; }
        .hidden { display: none !important; }
        .loading { text-align: center; padding: 50px; }
        .spinner { font-size: 40px; color: #38bdf8; animation: spin 1s infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .progress-dots { display: flex; justify-content: center; gap: 8px; margin-top: 15px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #334155; }
        .dot.completed { background: #22c55e; }
        .dot.current { background: #38bdf8; }

        /* Подсветка для правильных/неправильных ответов */
        .correct-flash { background: #064e3b !important; transition: background 0.2s; }
        .wrong-flash { background: #7f1d1d !important; transition: background 0.2s; }
        #task.correct { color: #22c55e; text-shadow: 0 0 20px #22c55e; }
        #task.wrong { color: #ef4444; text-shadow: 0 0 20px #ef4444; }
        #answer.correct-input { border-color: #22c55e; box-shadow: 0 0 15px #22c55e; }
        #answer.wrong-input { border-color: #ef4444; box-shadow: 0 0 15px #ef4444; }
    </style>
</head>
<body>
    <!-- VS ИНТРО ЭКРАН -->
    <div id="vsIntroScreen" class="vs-intro-screen hidden">
        <div class="vs-intro-content">
            <div class="vs-player-intro">
                <div class="human-intro" id="introPlayerChar" style="color: #ef4444;">
                    <div class="head"><div class="mouth"></div></div>
                    <div class="body"><div class="arms"><div class="arm left"></div><div class="arm right"></div></div></div>
                    <div class="legs"><div class="leg"></div><div class="leg"></div></div>
                </div>
                <div class="intro-name" id="introPlayerName">Вы</div>
                <div class="intro-elo" id="introPlayerElo">1200</div>
            </div>
            <div class="vs-text-intro">VS</div>
            <div class="vs-player-intro">
                <div class="human-intro" id="introOpponentChar" style="color: #3b82f6;">
                    <div class="head"><div class="mouth"></div></div>
                    <div class="body"><div class="arms"><div class="arm left"></div><div class="arm right"></div></div></div>
                    <div class="legs"><div class="leg"></div><div class="leg"></div></div>
                </div>
                <div class="intro-name" id="introOpponentName">Соперник</div>
                <div class="intro-elo" id="introOpponentElo">1200</div>
            </div>
        </div>
        <div class="countdown-timer" id="countdownTimer">3</div>
    </div>

    <div class="duel-container">
        <div class="duel-header">
            <a href="/menu" class="back-btn"><i class="fas fa-arrow-left"></i> В меню</a>
            <h1><i class="fas fa-crosshairs" style="color: #ef4444;"></i> Дуэль</h1>
            <div></div>
        </div>

        <div id="loadingScreen" class="loading">
            <i class="fas fa-spinner spinner"></i>
            <p style="margin-top: 20px; color: #94a3b8;" id="loadingText">Поиск соперника...</p>
        </div>

        <div id="gameScreen" class="hidden">
            <div class="vs-screen">
                <div class="player-card">
                    <div class="human-small" id="playerChar" style="color: #ef4444;">
                        <div class="head"><div class="mouth"></div></div>
                        <div class="body"><div class="arms"><div class="arm left"></div><div class="arm right"></div></div></div>
                        <div class="legs"><div class="leg"></div><div class="leg"></div></div>
                    </div>
                    <div class="player-name" id="playerName">Вы</div>
                    <div class="player-elo" id="playerElo">1200</div>
                    <div class="player-score" id="playerScore">0</div>
                </div>
                <div class="vs-badge">VS</div>
                <div class="player-card">
                    <div class="human-small" id="opponentChar" style="color: #3b82f6;">
                        <div class="head"><div class="mouth"></div></div>
                        <div class="body"><div class="arms"><div class="arm left"></div><div class="arm right"></div></div></div>
                        <div class="legs"><div class="leg"></div><div class="leg"></div></div>
                    </div>
                    <div class="player-name" id="opponentName">Соперник</div>
                    <div class="player-elo" id="opponentElo">1200</div>
                    <div class="player-score" id="opponentScore">0</div>
                </div>
            </div>

            <div class="round-info">
                Раунд <span id="currentRound">0</span>/<span id="maxRounds">5</span>
            </div>
            <div class="progress-dots" id="progressDots"></div>

            <div class="task-container">
                <div id="task">Загрузка...</div>
                <div class="answer-box">
                    <input type="text" id="answer" placeholder="Ваш ответ" autofocus>
                    <button onclick="submitAnswer()"><i class="fas fa-arrow-right"></i></button>
                </div>
            </div>
        </div>

        <div id="resultScreen" class="result-screen hidden"></div>
    </div>

    <script>
        let duelId = null;
        let currentTask = null;
        let playerName = '{{ name }}';
        let maxRounds = 5;
        let playerData = null;
        let opponentData = null;
        let countdown = 3;
        let countdownInterval = null;
        let queueCheckInterval = null;
        let waitingForOpponent = true;

        function updateProgressDots(current) {
            const dots = document.getElementById('progressDots');
            dots.innerHTML = '';
            for (let i = 0; i < maxRounds; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (i < current) dot.classList.add('completed');
                if (i === current) dot.classList.add('current');
                dots.appendChild(dot);
            }
        }
        updateProgressDots(0);

        async function startQueue() {
            try {
                const res = await fetch('/api/duel/queue', { method: 'POST' });
                const data = await res.json();

                if (data.status === 'matched') {
                    // Нашли соперника
                    clearInterval(queueCheckInterval);
                    duelId = data.duel_id;
                    playerData = data.player;
                    opponentData = data.opponent;
                    showIntro();
                } else if (data.status === 'waiting') {
                    document.getElementById('loadingText').textContent = `Поиск соперника... (в очереди: ${data.queue_length})`;
                }
            } catch (e) {
                console.error('Queue error:', e);
            }
        }

        function showIntro() {
            document.getElementById('loadingScreen').classList.add('hidden');

            // Заполняем интро
            document.getElementById('introPlayerName').textContent = playerData.name;
            document.getElementById('introPlayerElo').textContent = playerData.elo;
            document.getElementById('introPlayerChar').style.color = playerData.skin;

            document.getElementById('introOpponentName').textContent = opponentData.name;
            document.getElementById('introOpponentElo').textContent = opponentData.elo;
            document.getElementById('introOpponentChar').style.color = opponentData.skin;

            // Заполняем игру
            document.getElementById('playerName').textContent = playerData.name;
            document.getElementById('playerElo').textContent = playerData.elo;
            document.getElementById('playerChar').style.color = playerData.skin;

            document.getElementById('opponentName').textContent = opponentData.name;
            document.getElementById('opponentElo').textContent = opponentData.elo;
            document.getElementById('opponentChar').style.color = opponentData.skin;

            document.getElementById('vsIntroScreen').classList.remove('hidden');
            startCountdown();
        }

        function startCountdown() {
            countdown = 3;
            const timerEl = document.getElementById('countdownTimer');
            timerEl.textContent = countdown;

            countdownInterval = setInterval(() => {
                countdown--;
                timerEl.textContent = countdown;

                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('vsIntroScreen').classList.add('hidden');
                    document.getElementById('gameScreen').classList.remove('hidden');
                    loadTask();
                }
            }, 1000);
        }

        async function loadTask() {
            try {
                const res = await fetch(`/api/duel/${duelId}/task`);
                const data = await res.json();

                if (data.waiting) {
                    setTimeout(loadTask, 500);
                    return;
                }

                currentTask = data.task;
                const taskEl = document.getElementById('task');
                taskEl.className = '';
                document.getElementById('answer').className = '';

                if (currentTask.type === 'math' || currentTask.type === 'math_chain') {
                    taskEl.textContent = currentTask.q + ' = ?';
                } else if (currentTask.type === 'compare') {
                    taskEl.textContent = currentTask.q + ' (>, <, =)';
                } else if (currentTask.type === 'logic') {
                    taskEl.textContent = currentTask.seq.join(', ') + ', ?';
                }

                document.getElementById('answer').value = '';
                document.getElementById('answer').focus();
            } catch (e) {
                console.error('Load task error:', e);
                setTimeout(loadTask, 1000);
            }
        }

        async function submitAnswer() {
            const answerInput = document.getElementById('answer');
            const answer = answerInput.value.trim();
            if (!answer) return;

            const btn = document.querySelector('button');
            btn.disabled = true;

            try {
                const res = await fetch(`/api/duel/${duelId}/answer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answer })
                });
                const data = await res.json();

                const taskEl = document.getElementById('task');
                const body = document.body;

                // Подсветка
                if (data.correct) {
                    taskEl.classList.add('correct');
                    answerInput.classList.add('correct-input');
                    body.classList.add('correct-flash');
                    setTimeout(() => body.classList.remove('correct-flash'), 400);
                } else {
                    taskEl.classList.add('wrong');
                    answerInput.classList.add('wrong-input');
                    body.classList.add('wrong-flash');
                    setTimeout(() => body.classList.remove('wrong-flash'), 400);
                }

                document.getElementById('playerScore').textContent = data.player_score;
                document.getElementById('opponentScore').textContent = data.opponent_score;
                document.getElementById('currentRound').textContent = data.round;
                updateProgressDots(data.round);

                if (data.finished) {
                    showResult(data);
                } else {
                    setTimeout(() => {
                        taskEl.classList.remove('correct', 'wrong');
                        answerInput.classList.remove('correct-input', 'wrong-input');
                        loadTask();
                    }, 800);
                }
            } catch (e) {
                console.error('Submit error:', e);
                alert('Ошибка отправки ответа');
            } finally {
                btn.disabled = false;
            }
        }

        function showResult(data) {
            document.getElementById('gameScreen').classList.add('hidden');
            const resultScreen = document.getElementById('resultScreen');
            resultScreen.classList.remove('hidden');

            const isWinner = data.winner === 'player';
            const playerScore = data.player_score;
            const opponentScore = data.opponent_score;

            resultScreen.innerHTML = `
                <div style="font-size: 80px; margin-bottom: 20px;">
                    <i class="fas fa-${isWinner ? 'crown' : 'hand-peace'}" style="color: ${isWinner ? '#fbbf24' : '#94a3b8'};"></i>
                </div>
                <h2 style="font-size: 36px; margin-bottom: 20px; font-weight: 600;">${isWinner ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ'}</h2>
                <div style="font-size: 56px; font-weight: bold; margin: 20px 0;">${playerScore} - ${opponentScore}</div>
                <p style="color: #94a3b8; margin-bottom: 40px;">
                    ${isWinner ? 'Отличная игра! Твой ELO повышен.' : 'Попробуй ещё раз!'}
                </p>
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <a href="/duel" style="padding: 15px 35px; background: #38bdf8; color: #000; border-radius: 10px; text-decoration: none; font-weight: bold;">Играть снова</a>
                    <a href="/menu" style="padding: 15px 35px; background: #1e293b; color: #fff; border-radius: 10px; text-decoration: none;">В меню</a>
                </div>
            `;
        }

        document.getElementById('answer').addEventListener('keydown', e => {
            if (e.key === 'Enter') submitAnswer();
        });

        // Запускаем поиск
        queueCheckInterval = setInterval(startQueue, 1000);
        startQueue();
    </script>
</body>
</html>
