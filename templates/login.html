<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brain Trainer - Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
        }
        .auth-container {
            max-width: 450px;
            width: 100%;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(56, 189, 248, 0.2);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo i {
            font-size: 60px;
            background: linear-gradient(135deg, #38bdf8, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo h1 {
            color: white;
            font-size: 28px;
            margin-top: 10px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 8px;
        }
        .tab.active {
            color: white;
            background: rgba(56, 189, 248, 0.2);
        }
        .tab:hover {
            color: white;
        }
        .form-container {
            display: none;
        }
        .form-container.active {
            display: block;
        }
        .avatar-section {
            margin-bottom: 20px;
        }
        .avatar-label {
            display: block;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .avatar-option {
            aspect-ratio: 1;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 3px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .avatar-option.selected {
            border-color: white;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            transform: scale(1.05);
        }
        .avatar-preview {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
        }
        .preview-avatar {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.3);
        }
        .preview-text span {
            display: block;
            color: #94a3b8;
            font-size: 12px;
        }
        .preview-text strong {
            font-size: 16px;
            color: white;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border-radius: 12px;
            border: 2px solid #334155;
            background: #0f172a;
            color: white;
            outline: none;
            transition: all 0.2s;
        }
        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        .input-group input::placeholder {
            color: #64748b;
        }
        .password-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            cursor: pointer;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #38bdf8, #22c55e);
            color: #0f172a;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
        }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }
        @media (max-width: 480px) {
            .auth-container {
                padding: 20px;
            }
            .avatar-grid {
                gap: 8px;
            }
            .avatar-option {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <i class="fas fa-brain"></i>
            <h1>Brain Trainer</h1>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">Вход</button>
            <button class="tab" onclick="switchTab('register')">Регистрация</button>
        </div>

        <!-- Форма входа -->
        <div id="loginForm" class="form-container active">
            <form onsubmit="login(event)">
                <div class="input-group">
                    <label><i class="fas fa-user"></i> Имя пользователя</label>
                    <input type="text" id="loginUsername" placeholder="Введите имя" required>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-lock"></i> Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="Введите пароль" required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('loginPassword', this)"></i>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Войти</button>
            </form>
        </div>

        <!-- Форма регистрации -->
        <div id="registerForm" class="form-container">
            <form onsubmit="register(event)">
                <div class="avatar-section">
                    <label class="avatar-label"><i class="fas fa-user-circle"></i> Выбери аватар</label>
                    <div class="avatar-grid" id="avatarGrid">
                        <div class="avatar-option selected" data-color="#ef4444" data-icon="fa-user-astronaut" data-name="Астронавт" onclick="selectAvatar(this)">
                            <i class="fas fa-user-astronaut"></i>
                        </div>
                        <div class="avatar-option" data-color="#f97316" data-icon="fa-user-ninja" data-name="Ниндзя" onclick="selectAvatar(this)">
                            <i class="fas fa-user-ninja"></i>
                        </div>
                        <div class="avatar-option" data-color="#fbbf24" data-icon="fa-user-secret" data-name="Агент" onclick="selectAvatar(this)">
                            <i class="fas fa-user-secret"></i>
                        </div>
                        <div class="avatar-option" data-color="#22c55e" data-icon="fa-user-tie" data-name="Бизнесмен" onclick="selectAvatar(this)">
                            <i class="fas fa-user-tie"></i>
                        </div>
                        <div class="avatar-option" data-color="#06b6d4" data-icon="fa-user-graduate" data-name="Студент" onclick="selectAvatar(this)">
                            <i class="fas fa-user-graduate"></i>
                        </div>
                        <div class="avatar-option" data-color="#3b82f6" data-icon="fa-user-pilot" data-name="Пилот" onclick="selectAvatar(this)">
                            <i class="fas fa-user-pilot"></i>
                        </div>
                        <div class="avatar-option" data-color="#8b5cf6" data-icon="fa-music" data-name="Музыкант" onclick="selectAvatar(this)">
                            <i class="fas fa-music"></i>
                        </div>
                        <div class="avatar-option" data-color="#ec4899" data-icon="fa-crown" data-name="Король" onclick="selectAvatar(this)">
                            <i class="fas fa-crown"></i>
                        </div>
                    </div>
                    <div class="avatar-preview">
                        <div class="preview-avatar" id="avatarPreview" style="background: #ef4444;">
                            <i class="fas fa-user-astronaut"></i>
                        </div>
                        <div class="preview-text">
                            <span>Твой аватар</span>
                            <strong id="avatarName">Астронавт</strong>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label><i class="fas fa-user"></i> Имя пользователя</label>
                    <input type="text" id="regUsername" placeholder="От 3 символов" minlength="3" required>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-envelope"></i> Email (необязательно)</label>
                    <input type="email" id="regEmail" placeholder="example@mail.com">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-lock"></i> Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" placeholder="От 6 символов" minlength="6" required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('regPassword', this)"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-lock"></i> Подтвердите пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPasswordConfirm" placeholder="Повторите пароль" required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('regPasswordConfirm', this)"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Зарегистрироваться</button>
            </form>
        </div>

        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        let selectedAvatar = {
            color: '#ef4444',
            icon: 'fa-user-astronaut',
            name: 'Астронавт'
        };

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));

            if (tab === 'login') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
            document.getElementById('errorMessage').textContent = '';
        }

        function selectAvatar(element) {
            document.querySelectorAll('.avatar-option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');

            selectedAvatar = {
                color: element.dataset.color,
                icon: element.dataset.icon,
                name: element.dataset.name
            };

            const preview = document.getElementById('avatarPreview');
            preview.style.background = selectedAvatar.color;
            preview.innerHTML = `<i class="fas ${selectedAvatar.icon}"></i>`;
            document.getElementById('avatarName').textContent = selectedAvatar.name;
        }

        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function login(event) {
            event.preventDefault();
            const btn = event.target.querySelector('button');
            btn.disabled = true;

            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    document.getElementById('errorMessage').textContent = data.error;
                }
            } catch (e) {
                document.getElementById('errorMessage').textContent = 'Ошибка соединения';
            } finally {
                btn.disabled = false;
            }
        }

        async function register(event) {
            event.preventDefault();
            const btn = event.target.querySelector('button');
            btn.disabled = true;

            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;

            if (password !== passwordConfirm) {
                document.getElementById('errorMessage').textContent = 'Пароли не совпадают';
                btn.disabled = false;
                return;
            }

            if (username.length < 3) {
                document.getElementById('errorMessage').textContent = 'Имя должно быть не менее 3 символов';
                btn.disabled = false;
                return;
            }

            if (password.length < 6) {
                document.getElementById('errorMessage').textContent = 'Пароль должен быть не менее 6 символов';
                btn.disabled = false;
                return;
            }

            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        avatar_color: selectedAvatar.color,
                        avatar_icon: selectedAvatar.icon
                    })
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    document.getElementById('errorMessage').textContent = data.error;
                }
            } catch (e) {
                document.getElementById('errorMessage').textContent = 'Ошибка соединения';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
